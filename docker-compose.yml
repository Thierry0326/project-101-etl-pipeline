# version: "3.8"

services:
  # ============================================
  # SQL SERVER - Raw/Staging Database
  # ============================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: project101_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - project101_network
    restart: unless-stopped

  # ============================================
  # MYSQL - Processed/Analytics Database
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: project101_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/mysql_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - project101_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # GRAFANA - Monitoring Dashboard
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: project101_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - project101_network
    restart: unless-stopped

  # ============================================
  # AIRFLOW - One-shot init: db migrate + create admin user
  # ============================================
  airflow-init:
    build: .
    container_name: project101_airflow_init
    depends_on:
      mysql:
        condition: service_healthy
      sqlserver:
        condition: service_started
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/airflow_metadata
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_SECRET_KEY}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_HOST: project101_sqlserver
      MSSQL_PORT: "1433"
      MSSQL_USER: sa
      MYSQL_HOST: project101_mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes: &airflow_volumes
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./.env:/opt/airflow/.env
      - airflow_logs:/opt/airflow/logs
    networks:
      - project101_network
    restart: "no"
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create
      --username admin
      --password ${AIRFLOW_ADMIN_PASSWORD}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_ALERT_EMAIL} || true)
      "

  # ============================================
  # AIRFLOW - Webserver (UI at :8080)
  # ============================================
  airflow-webserver:
    build: .
    container_name: project101_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    ports:
      - "8080:8080"
    volumes: *airflow_volumes
    networks:
      - project101_network
    restart: unless-stopped
    command: airflow webserver --port 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ============================================
  # AIRFLOW - Scheduler (runs DAGs)
  # ============================================
  airflow-scheduler:
    build: .
    container_name: project101_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    networks:
      - project101_network
    restart: unless-stopped
    command: airflow scheduler

# ============================================
# VOLUMES - Persistent Data Storage
# ============================================
volumes:
  sqlserver_data:
  mysql_data:
  grafana_data:
  airflow_logs:

# ============================================
# NETWORK - All containers talk to each other
# ============================================
networks:
  project101_network:
    driver: bridge
